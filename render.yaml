# Render Blueprint - deploys the full stack in one pass:
#   portfolio-crm-web     web service   (public site + /admin CMS; runs migrations
#                                        on boot AND runs the queue worker in-process -
#                                        see docker/entrypoint.sh. No separate worker
#                                        service: Render's free plan doesn't offer the
#                                        "Background Worker" service type at all -
#                                        creating one fails with "service type is not
#                                        available for this plan" - so queue:work runs
#                                        alongside php artisan serve in the same
#                                        container instead of its own service.)
#   portfolio-crm-reverb  web service   (Laravel Reverb websocket server - needs to be public)
#   portfolio-crm-db      Postgres      (managed - Render has no managed MySQL)
#   portfolio-crm-redis   Key Value     (Redis-compatible - session/cache/queue driver)
#
# Both app services build from the same Dockerfile and pick their role via
# APP_ROLE (see docker/entrypoint.sh). Deploy via the Render dashboard:
# New + -> Blueprint -> connect this repo -> Apply.
#
# Everything below is on the FREE plan per your choice: the web/reverb
# services spin down after 15 min idle (cold start on the next request),
# and the Postgres/Key Value instances are deleted 30 days after creation
# unless upgraded to a paid plan before then - see the deploy notes doc for
# the reminder to set a calendar note for that.
#
# If you later upgrade this workspace to a paid plan and want the queue
# worker isolated in its own process again (better for job throughput/
# reliability than the in-process loop above), add back:
#   - type: worker
#     name: portfolio-crm-worker
#     runtime: docker
#     dockerfilePath: ./Dockerfile
#     plan: starter
#     envVars:
#       - key: APP_ROLE
#         value: worker
#       - key: APP_URL
#         value: https://portfolio-crm-web.onrender.com
#       - key: DB_URL
#         fromDatabase: { name: portfolio-crm-db, property: connectionString }
#       - key: REDIS_URL
#         fromService: { type: keyvalue, name: portfolio-crm-redis, property: connectionString }
#       - fromGroup: portfolio-crm-shared
# (docker/entrypoint.sh already supports APP_ROLE=worker, unchanged, so this
# is the only edit needed.)

databases:
  - name: portfolio-crm-db
    plan: free
    databaseName: portfolio_crm
    user: portfolio_crm

services:
  - type: keyvalue
    name: portfolio-crm-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (the app services reach this over Render's internal network regardless; a connection still requires the generated auth credentials)

  - type: web
    name: portfolio-crm-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_ROLE
        value: web
      - key: APP_URL
        value: https://portfolio-crm-web.onrender.com
      - key: DB_URL
        fromDatabase:
          name: portfolio-crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portfolio-crm-redis
          property: connectionString
      - fromGroup: portfolio-crm-shared

  - type: web
    name: portfolio-crm-reverb
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_ROLE
        value: reverb
      - key: APP_URL
        value: https://portfolio-crm-web.onrender.com
      - key: DB_URL
        fromDatabase:
          name: portfolio-crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portfolio-crm-redis
          property: connectionString
      - fromGroup: portfolio-crm-shared

envVarGroups:
  - name: portfolio-crm-shared
    envVars:
      # Shared across all three app services so encrypted cookies/sessions
      # and Reverb's broadcast-auth signatures agree - do NOT let these
      # drift between services (e.g. by overriding one in the dashboard).
      - key: APP_KEY
        generateValue: true
      - key: REVERB_APP_ID
        value: portfolio-crm
      - key: REVERB_APP_KEY
        value: portfolio-crm-key
      - key: REVERB_APP_SECRET
        generateValue: true

      - key: APP_NAME
        value: "Ankit Vishwakarma - Portfolio"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: pgsql

      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: BROADCAST_CONNECTION
        value: reverb

      # Reverb's own server binds to $PORT via docker/entrypoint.sh; this is
      # what the OTHER services (web signing broadcast auth) use to know
      # where the Reverb server publicly lives.
      - key: REVERB_HOST
        value: portfolio-crm-reverb.onrender.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https

      # Switched to Cloudflare R2 (S3-compatible, free 10GB tier) - Render's
      # free web service has NO persistent disk, so anything written to
      # local storage (avatars/resumes/thumbnails/badges) was being LOST on
      # every redeploy or restart. config/filesystems.php's 'public' disk
      # already reads all the AWS_* vars below with zero code changes -
      # this is purely config. The secret values themselves
      # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_BUCKET /
      # AWS_ENDPOINT / AWS_URL) are NOT committed here - set only via the
      # Render dashboard's Environment tab, same rule as ADMIN_SEED_PASSWORD
      # above. This value (driver name, not a secret) IS committed so a
      # future Blueprint sync doesn't silently revert it back to "local".
      - key: PUBLIC_DISK_DRIVER
        value: s3
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
